[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "txbench"
version = "0.1.0"
description = "Historical Ethereum transaction benchmark: labeled cohort, cache-first collector, feature views, detector-input audit and evaluation."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.17"]
dev = ["pytest>=7.4"]

[project.scripts]
bench = "txbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
txbench = ["resources/*.json", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "fixture_data: runs only against explicitly-marked fixture data, never real upstream labels",
    "needs_keys: requires live RPC credentials; skipped when absent",
]
